<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#C8261D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Bus Timing</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0D12;--card:#161A22;--hi:#1E2430;--line:#252C3A;--ink:#F2F4F8;--mute:#8A94A6;--red:#E5352B;--bar:#C8261D;--g:#7ED321;--a:#F5A623;--f:Barlow,system-ui,sans-serif;--n:"Barlow Condensed",Barlow,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--ink);font:400 16px/1.35 var(--f);-webkit-tap-highlight-color:transparent}
body{max-width:560px;margin:auto;min-height:100vh;padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}
button,input{font:inherit;color:inherit;background:none;border:0}button{cursor:pointer}
:focus-visible{outline:2px solid #fff;outline-offset:2px;border-radius:8px}
header{position:sticky;top:0;z-index:9;background:var(--bar);padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;display:flex;align-items:center;justify-content:space-between}
header h1{font:700 26px var(--n);letter-spacing:.01em;flex:1;text-align:center}
header button{width:44px;height:36px;font-size:20px;position:relative}
#rf.spin span{display:inline-block;animation:s .7s linear}@keyframes s{to{transform:rotate(360deg)}}
main{padding:12px}
.sb{width:100%;height:48px;border-radius:12px;background:var(--card);border:1px solid var(--line);padding:0 16px;margin-bottom:12px;font-size:17px}
.sb::placeholder{color:var(--mute)}
.card{background:var(--card);border-radius:12px;margin-bottom:10px;overflow:hidden}
.top{display:flex;align-items:center;gap:12px;padding:12px 8px 12px 14px}
.hd{flex:1;text-align:left;display:flex;align-items:center;gap:12px;min-width:0}
.dist{font-size:12px;color:var(--mute);text-align:center;min-width:44px}
.dist:before{content:"➤";display:block;color:var(--red);font-size:16px}
.nm{font:600 19px var(--f);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--mute);font-size:14px}.sub b{font-weight:500;color:#aab3c2;margin-right:10px}
.ic{width:40px;height:40px;font-size:20px;color:var(--mute);border-radius:20px}.ic.on{color:var(--red)}
.sv{display:grid;grid-template-columns:1.1fr 1fr 1fr 1fr;gap:6px;padding:11px 14px;border-top:1px solid var(--line);align-items:start}
.no{text-align:left}.no b{font:700 26px/1 var(--n);display:block;letter-spacing:.01em}
.no small{color:var(--mute);font-size:12px;display:block;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.no.pin b{color:#5AA2FF}.no.pin b:after{content:" ★";font-size:13px}
.c b{font:500 22px/1 var(--n);display:block}.c b.now{color:var(--g)}
.c small{color:var(--mute);font-size:12px;display:block;margin-top:3px;min-height:14px}
.bar{display:block;height:4px;width:46px;background:#333b4a;border-radius:2px;overflow:hidden;margin-top:5px}
.bar u{display:block;height:100%}.l1{width:33%;background:var(--g)}.l2{width:66%;background:var(--a)}.l3{width:100%;background:var(--red)}
.msg{padding:14px;color:var(--mute);font-size:15px}.err{color:#ff8a80}
.empty{text-align:center;color:var(--mute);padding:48px 24px}
.row{display:flex;justify-content:space-between;align-items:center;padding:16px;background:var(--card);border-radius:12px;margin-bottom:10px}
.row button.pill{background:var(--hi);padding:8px 14px;border-radius:18px;font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;width:100%;max-width:560px}
nav button{flex:1;padding:9px 0 10px;color:var(--mute);font-size:12px;font-weight:500}
nav button span{display:block;font-size:22px;line-height:1.1}nav button[aria-current=page]{color:var(--red)}
</style></head><body>
<header><span style="width:44px"></span><h1 id="t">Nearby</h1><button id="rf" aria-label="Refresh"><span>⟳</span></button></header>
<main><input id="q" class="sb" placeholder="Bus stop code or name" autocomplete="off" hidden><div id="m"></div></main>
<nav><div id="nav">
<button data-t="near"><span>◉</span>Nearby</button>
<button data-t="fav"><span>♥</span>Saved</button>
<button data-t="search"><span>⌕</span>Search</button>
<button data-t="set"><span>⚙</span>Settings</button>
</div></nav>
<script>
const API='/.netlify/functions/lta',$=s=>document.querySelector(s);
const L=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},W=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
let stops=L('stops2',[]),by={},favs=L('favs',[]),pins=L('pins',[]),auto=L('auto',true),tab='near',pos=null,gerr='',arr={},open=new Set(),q='',list=[];
const T={near:'Nearby',fav:'Saved',search:'Search',set:'Settings'};
async function api(p){const r=await fetch(API+'?'+p);let j;try{j=await r.json()}catch{throw new Error(r.status==404?'Backend not found (404). Check that netlify.toml and the netlify folder are in your repo.':'Unexpected reply ('+r.status+')')}if(!r.ok)throw new Error(j.error||'Error '+r.status);return j}
const idx=()=>{by={};stops.forEach(s=>by[s[0]]=s)};idx();
async function loadStops(){if(stops.length)return;stops=await api('type=stops');W('stops2',stops);idx()}
function dist(s){if(!pos)return 1e9;const R=6371e3,r=Math.PI/180,a=Math.sin((s[3]-pos.lat)*r/2)**2+Math.cos(pos.lat*r)*Math.cos(s[3]*r)*Math.sin((s[4]-pos.lng)*r/2)**2;return 2*R*Math.asin(Math.sqrt(a))}
const dtxt=d=>d<1e8?(d<1000?Math.round(d)+'m':(d/1000).toFixed(1)+'km'):'';
async function getArr(c,force){const a=arr[c];if(!force&&a&&Date.now()-a.at<25e3)return;arr[c]={...a,load:true};try{const j=await api('stop='+c);arr[c]={at:Date.now(),data:j.services}}catch(e){arr[c]={at:Date.now(),err:e.message}}}
const mins=t=>Math.floor((new Date(t)-Date.now())/6e4);
const nameOf=c=>by[c]?by[c][1]:'';
function col(n){if(!n)return'<div class="c"><b>–</b></div>';const m=mins(n.t);return`<div class="c"><b class="${m<=0?'now':''}">${m<=0?'Arr':m}</b><i class="bar"><u class="l${{SEA:1,SDA:2,LSD:3}[n.ld]||1}"></u></i><small>${n.dd?'Double':''}${n.wab?' ♿':''}</small></div>`}
function card(c){const s=by[c];if(!s)return'';const o=open.has(c),a=arr[c],f=favs.includes(c);let body='';
 if(o){if(!a||(a.load&&!a.data&&!a.err))body='<div class="msg">Loading timings…</div>';
 else if(a.err)body=`<div class="msg err">${a.err}</div>`;
 else if(!a.data.length)body='<div class="msg">No buses running right now.</div>';
 else body=[...a.data].sort((x,y)=>(pins.includes(y.no)-pins.includes(x.no))||x.no.localeCompare(y.no,'en',{numeric:true})).map(v=>`<div class="sv"><button class="no ${pins.includes(v.no)?'pin':''}" data-pin="${v.no}"><b>${v.no}</b><small>${nameOf(v.to)}</small></button>${v.next.map(col).join('')}</div>`).join('')}
 return`<div class="card"><div class="top"><button class="hd" data-o="${c}"><span class="dist">${dtxt(dist(s))}</span><span style="min-width:0"><span class="nm" style="display:block">${s[1]}</span><span class="sub"><b>${c}</b>${s[2]}</span></span></button><button class="ic ${f?'on':''}" data-f="${c}" aria-label="Save stop">${f?'♥':'♡'}</button></div>${body}</div>`}
async function render(){const m=$('#m');$('#t').textContent=T[tab];$('#q').hidden=tab!=='search';
 document.querySelectorAll('nav button').forEach(b=>b.toggleAttribute('aria-current',b.dataset.t===tab)||b.removeAttribute('aria-current'));
 document.querySelectorAll('nav button').forEach(b=>b.dataset.t===tab?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));
 if(tab==='set'){m.innerHTML=`<div class="row"><span>Auto-refresh every 30s</span><button class="pill" data-a>${auto?'On':'Off'}</button></div><div class="row"><span>Check backend connection</span><button class="pill" data-test>Test</button></div><div class="row"><span>Reload stop list</span><button class="pill" data-clr>Reset</button></div><p class="msg" id="tr"></p>`;return}
 if(!stops.length){m.innerHTML='<div class="empty">Loading bus stops…</div>';try{await loadStops()}catch(e){m.innerHTML=`<div class="empty err">${e.message}</div>`;return}}
 if(tab==='near'){if(!pos){m.innerHTML=`<div class="empty">${gerr||'Finding your location…'}</div>`;return}list=[...stops].sort((a,b)=>dist(a)-dist(b)).slice(0,6).map(s=>s[0]);if(!open.size)open.add(list[0])}
 if(tab==='fav')list=favs;
 if(tab==='search'){const k=q.trim().toLowerCase();list=!k?[]:/^\d{5}$/.test(k)&&by[k]?[k]:stops.filter(s=>(s[1]+' '+s[2]+' '+s[0]).toLowerCase().includes(k)).slice(0,10).map(s=>s[0])}
 if(!list.length){m.innerHTML=`<div class="empty">${tab==='fav'?'Tap ♡ on a stop to save it here.':tab==='search'?(q?'No stops found.':'Search by stop code or name.'):''}</div>`;return}
 m.innerHTML=list.map(card).join('');
 const need=list.filter(c=>open.has(c)&&(!arr[c]||!(arr[c].data||arr[c].err)));if(need.length){await Promise.all(need.map(c=>getArr(c)));m.innerHTML=list.map(card).join('')}}
async function refresh(){const b=$('#rf');b.classList.add('spin');if(tab==='near'&&!pos)locate();if(list.length)await Promise.all(list.filter(c=>open.has(c)).map(c=>getArr(c,true)));if(tab!=='set'&&!$('#m').querySelector('.empty'))$('#m').innerHTML=list.map(card).join('');setTimeout(()=>b.classList.remove('spin'),700)}
function locate(){if(!navigator.geolocation){gerr='Location is not supported on this device.';return render()}navigator.geolocation.getCurrentPosition(p=>{pos={lat:p.coords.latitude,lng:p.coords.longitude};render()},()=>{gerr='Allow location access to see stops near you, or use Search.';render()},{enableHighAccuracy:true,timeout:15000,maximumAge:3e4})}
document.addEventListener('click',async e=>{const t=e.target.closest('button');if(!t)return;
 if(t.dataset.t){tab=t.dataset.t;if(tab==='near'&&!pos)locate();scrollTo(0,0);return render()}
 if(t.id==='rf')return refresh();
 if(t.dataset.o){const c=t.dataset.o;open.has(c)?open.delete(c):open.add(c);return render()}
 if(t.dataset.f){const c=t.dataset.f;favs=favs.includes(c)?favs.filter(x=>x!==c):[...favs,c];W('favs',favs);return render()}
 if(t.dataset.pin){const n=t.dataset.pin;pins=pins.includes(n)?pins.filter(x=>x!==n):[...pins,n];W('pins',pins);return render()}
 if(t.dataset.a!==undefined){auto=!auto;W('auto',auto);return render()}
 if(t.dataset.clr!==undefined){stops=[];W('stops2',[]);return render()}
 if(t.dataset.test!==undefined){const o=$('#tr');o.className='msg';o.textContent='Testing…';try{const j=await api('stop=44229');o.textContent='Working. Got '+j.services.length+' services at stop 44229.'}catch(x){o.className='msg err';o.textContent=x.message}}});
$('#q').addEventListener('input',e=>{q=e.target.value;const k=q.trim();if(/^\d{5}$/.test(k))open.add(k);render()});
setInterval(()=>{if(auto&&!document.hidden)refresh()},3e4);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&auto)refresh()});
locate();render();
</script></body></html>
